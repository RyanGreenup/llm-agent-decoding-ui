services:
  app:
    build: .
    ports:
      - "${PORT:-3075}:${PORT:-3075}"
    environment:
      PORT: ${PORT:-3075}
      DATABASE_PATH: ${DATABASE_PATH:-./data/app.db}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAW_DOC_PATH: ${RAW_DOC_PATH:-./data/Product Disclosure Statement (PDS).docx}
